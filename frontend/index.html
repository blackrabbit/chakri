<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chakri — Court Piece</title>
    <script>
      (() => {
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const applyTheme = () => document.documentElement.dataset.theme = media.matches ? "dark" : "light";
        applyTheme();
        media.addEventListener?.("change", applyTheme);
      })();
    </script>
    <style>
      :root {
        --felt: #0d5c3f;
        --felt-dark: #093d2a;
        --felt-light: #127a52;
        --gold: #d4af37;
        --card-bg: #fffef7;
        --card-shadow: rgba(0, 0, 0, 0.3);
        --text: #f0f0f0;
        --text-dim: #a0a0a0;
        --team-a: #4a90d9;
        --team-b: #e0654a;
        --surface: #ffffff;
        --surface-muted: #f4f7fb;
        --border: #e5eaf1;
        --ink: #172033;
        --ink-muted: #718096;
        --page: #eef2f7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--page);
        color: var(--ink);
        overflow: hidden;
      }
      button, select { font: inherit; }
      html[data-theme="dark"] { --surface: #182232; --surface-muted: #202d40; --border: #304056; --ink: #edf3fb; --ink-muted: #91a0b5; --page: #0d1522; --felt-dark: #0d1522; --card-bg: #f9fbff; --card-shadow: rgba(0,0,0,.45); }
      html[data-theme="dark"] body { background: var(--page); }
      html[data-theme="light"] .home-page, html[data-theme="light"] .lobby-page { background: radial-gradient(circle at 50% 0%, #ffffff 0%, #eef2f7 58%, #e2e9f1 100%); color: var(--ink); }
      html[data-theme="light"] .home-card, html[data-theme="light"] .lobby-card { border-color: var(--border); background: rgba(255,255,255,.88); box-shadow: 0 24px 80px rgba(31,45,61,.12); }
      html[data-theme="light"] .home-card h1, html[data-theme="light"] .lobby-header h1 { color: var(--ink); }
      html[data-theme="light"] .home-subtitle, html[data-theme="light"] .lobby-message, html[data-theme="light"] .team-legend { color: var(--ink-muted); }
      html[data-theme="light"] .modern-input { border-color: var(--border); background: var(--surface-muted); color: var(--ink); }
      html[data-theme="light"] .modern-input::placeholder { color: var(--ink-muted); }
      html[data-theme="light"] .lobby-seat { border-color: #cbd5e1; color: var(--ink-muted); }
      html[data-theme="light"] .lobby-seat.filled { border-color: var(--border); background: var(--surface-muted); color: var(--ink); }
      html[data-theme="light"] .lobby-seat small, html[data-theme="light"] .seat-number { color: var(--ink-muted); }
      html[data-theme="light"] .invite-box { background: var(--surface-muted); }
      html[data-theme="light"] .account-chip { border-color: var(--border); background: rgba(255,255,255,.9); color: var(--ink-muted); }
      html[data-theme="light"] .account-chip strong { color: var(--ink); }
      .home-page, .lobby-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background-color: #091923; background-image: radial-gradient(circle at 50% 0%, #274e62 0%, #102d3b 42%, #091923 100%), linear-gradient(rgba(56,217,230,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(56,217,230,.08) 1px, transparent 1px); background-size: auto, 24px 24px, 24px 24px; color: white; }
      .home-toolbar { position: fixed; top: 18px; right: 22px; display: flex; align-items: center; gap: 10px; z-index: 10; }
      .account-chip { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 5px; border: 2px solid rgba(255,255,255,.2); border-radius: 4px; background: rgba(10,20,32,.72); color: #b8c8d7; box-shadow: 3px 3px 0 rgba(0,0,0,.25); font-size: .7rem; }
      .account-chip strong { color: white; }
      .account-avatar { width: 26px; height: 26px; display: grid; place-items: center; border: 2px solid var(--pixel-ink); border-radius: 3px; background: var(--pixel-cyan); color: var(--pixel-ink); font-weight: 900; }
      .account-chip button { border: 0; border-left: 1px solid rgba(255,255,255,.18); padding: 3px 6px 3px 10px; background: none; color: var(--gold); cursor: pointer; font-family: inherit; font-size: .68rem; font-weight: 800; }
      .home-card, .lobby-card { width: min(100%, 620px); padding: 42px; border: 1px solid rgba(255,255,255,.14); border-radius: 24px; background: rgba(17,31,43,.78); box-shadow: 0 24px 80px rgba(0,0,0,.28); backdrop-filter: blur(18px); }
      .home-card { width: min(100%, 440px); text-align: center; }
      .brand-mark { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 16px; background: var(--gold); color: #172033; font-size: 1.8rem; box-shadow: 0 8px 24px rgba(212,175,55,.25); }
      .home-card h1 { margin: 4px 0 6px; color: white; font-size: 3.2rem; letter-spacing: -.06em; }
      .home-subtitle, .lobby-message { color: #a9bac8; }
      .home-form { display: grid; gap: 11px; margin-top: 28px; }
      .modern-input { width: 100%; padding: 13px 15px; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; outline: none; background: rgba(255,255,255,.1); color: white; font-size: .95rem; }
      .modern-input::placeholder { color: #9aabba; }
      .modern-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,.15); }
      .primary-action, .secondary-action { border: 0; border-radius: 10px; padding: 13px 16px; font-weight: 800; cursor: pointer; }
      .primary-action { background: var(--gold); color: #2d260e; }
      .primary-action span { float: right; font-size: 1.1rem; }
      .secondary-action { background: var(--team-a); color: white; }
      .join-row { display: flex; gap: 8px; }
      .home-footnote, .lobby-footnote { margin-top: 22px; color: #8498aa; font-size: .72rem; }
      .auth-error { padding: 10px; border: 1px solid rgba(248,113,113,.45); border-radius: 9px; background: rgba(248,113,113,.12); color: #ff9b9b; font-size: .78rem; }
      .auth-switch { margin-top: 18px; border: 0; background: none; color: #a9c4df; cursor: pointer; font-size: .78rem; }
      .auth-switch:hover { color: var(--gold); }
      .primary-action:disabled { cursor: wait; opacity: .65; }
      .lobby-card { max-width: 760px; }
      .lobby-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
      .lobby-header h1 { margin: 4px 0 0; color: white; font-size: 2rem; letter-spacing: -.04em; }
      .lobby-message { margin: 20px 0; font-size: .9rem; }
      .lobby-seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .lobby-seat { min-height: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: 1px dashed rgba(255,255,255,.2); border-radius: 14px; color: #a9bac8; }
      .lobby-seat.filled { border-style: solid; border-color: rgba(255,255,255,.13); background: rgba(255,255,255,.07); color: white; }
      .lobby-seat small { color: #8ea2b2; font-size: .7rem; }
      .lobby-avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: white; font-weight: 800; }
      .seat-number { color: #60778b; font-size: .75rem; font-weight: 800; }
      .offline-label { color: #f87171 !important; }
      .team-legend { display: flex; justify-content: center; gap: 20px; margin: 20px 0; color: #a9bac8; font-size: .75rem; }
      .team-legend span { display: flex; align-items: center; gap: 6px; }
      .lobby-start { display: block; width: 220px; margin: 0 auto; }
      .lobby-actions { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
      .bot-button { display: block; margin: 0; border: 1px solid var(--gold); background: rgba(212,175,55,.14); color: var(--gold); }
      .bot-label { color: var(--pixel-cyan); }
      .seat-bot-button { margin-top: 3px; padding: 4px 6px; border: 1px solid rgba(255,255,255,.22); border-radius: 3px; background: rgba(0,0,0,.18); color: var(--gold); cursor: pointer; font-family: inherit; font-size: .58rem; font-weight: 800; text-transform: uppercase; }
      .invite-box { margin-top: 24px; padding: 14px; border-radius: 12px; background: rgba(0,0,0,.18); text-align: center; }
      .invite-box small { display: block; margin-bottom: 7px; color: #8ea2b2; }
      .invite-box code { display: block; overflow: hidden; color: var(--gold); cursor: pointer; text-overflow: ellipsis; white-space: nowrap; font-size: .72rem; }
      .game-shell {
        position: relative;
        display: grid;
        grid-template-columns: 250px minmax(360px, 1fr) 370px;
        gap: 16px;
        height: 100%;
        padding: 56px 18px 18px;
        background: #eef2f7;
        color: var(--ink);
      }
      .players-panel, .hand-panel, .table-panel {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 8px 28px rgba(31, 45, 61, .07);
      }
      .players-panel, .hand-panel { padding: 20px 16px; }
      .players-panel { display: flex; flex-direction: column; }
      .table-panel { position: relative; display: flex; flex-direction: column; padding: 24px; overflow: hidden; }
      .panel-heading, .table-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .panel-heading h2, .table-header h1 { margin: 3px 0 0; color: var(--ink); letter-spacing: -.03em; }
      .panel-heading h2 { font-size: 1.18rem; }
      .table-header h1 { font-size: 1.65rem; }
      .eyebrow { color: var(--ink-muted); font-size: .68rem; font-weight: 800; letter-spacing: .12em; }
      .player-count, .info-badge, .turn-pill { padding: 5px 9px; border-radius: 999px; background: var(--surface-muted); color: var(--ink-muted); font-size: .72rem; font-weight: 700; white-space: nowrap; }
      .table-badges { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
      .info-badge b { color: var(--ink); }
      .trump-badge { background: #fff7df; }
      .player-list { display: grid; gap: 7px; margin-top: 20px; }
      .player-row { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px; border: 1px solid transparent; border-radius: 12px; transition: .15s ease; }
      .player-row.is-current { background: #fff9e8; border-color: #f2d77b; box-shadow: 0 2px 8px rgba(212,175,55,.12); }
      .player-row.is-me { background: #f5f8ff; }
      .player-row.is-current.is-me { background: #fff9e8; }
      .player-avatar { flex: 0 0 34px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: white; font-weight: 800; }
      .player-details { min-width: 0; flex: 1; }
      .player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .86rem; font-weight: 750; }
      .player-meta { display: flex; align-items: center; gap: 5px; margin-top: 3px; color: var(--ink-muted); font-size: .68rem; }
      .team-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--team-a); }
      .team-dot.team-1 { background: var(--team-b); }
      .you-tag { margin-left: 4px; color: #6584c4; font-size: .58rem; letter-spacing: .06em; }
      .away-tag { color: #f59e0b; font-size: .58rem; font-weight: 900; letter-spacing: .05em; }
      .player-status { display: flex; align-items: center; gap: 6px; }
      .player-bot-toggle { width: 20px; height: 20px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface-muted); color: var(--ink-muted); cursor: pointer; font-family: inherit; font-size: .6rem; font-weight: 900; }
      .player-bot-toggle:hover { border-color: var(--gold); color: var(--gold); }
      .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; }
      .connection-dot.online { background: #42c889; box-shadow: 0 0 0 3px #e6f8ef; }
      .dealer-tag { color: #d4a51d; font-size: 1rem; }
      .score-panel { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
      .score-line { display: flex; justify-content: space-between; padding-top: 9px; color: var(--ink-muted); font-size: .8rem; }
      .score-line span { display: flex; align-items: center; gap: 7px; }
      .score-line strong { color: var(--ink); }
      .message-banner { margin-top: 20px; padding: 10px 13px; border-radius: 10px; background: var(--surface-muted); color: var(--ink-muted); font-size: .78rem; }
      .trick-area { flex: 1; min-height: 250px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 20px 0; border: 1px dashed #d8e0eb; border-radius: 16px; background: linear-gradient(145deg, #f9fbfd, #f2f6fa); }
      .played-card { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink-muted); font-size: .68rem; font-weight: 650; }
      .empty-trick { text-align: center; color: #aab6c5; }
      .empty-trick span { display: block; color: #d4dce6; font-size: 2.5rem; }
      .empty-trick p { margin-top: 6px; font-size: .78rem; }
      .hand-panel { overflow: auto; }
      .hand-status-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
      .turn-pill { background: #e8f8ef; color: #258052; }
      .away-button { padding: 5px 8px; border: 2px solid var(--border); border-radius: 4px; background: var(--surface-muted); color: var(--ink-muted); cursor: pointer; font-family: inherit; font-size: .65rem; font-weight: 800; text-transform: uppercase; }
      .away-button.is-away, .seat-bot-button.is-away { border-color: #f59e0b; background: rgba(245,158,11,.15); color: #f59e0b; }
      .hand-grid { display: grid; grid-template-columns: repeat(4, 64px); justify-content: center; gap: 9px; margin-top: 22px; }
      .hint { margin: 18px 0 0; color: var(--ink-muted); text-align: center; font-size: .76rem; }
      .primary-button { border: 0; border-radius: 9px; padding: 10px 20px; background: var(--gold); color: #352b0d; font-weight: 800; cursor: pointer; }
      .scoring-card { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(90%, 330px); padding: 28px; border: 1px solid #efd475; border-radius: 16px; background: white; text-align: center; box-shadow: 0 16px 40px rgba(31,45,61,.18); }
      .scoring-card h2 { margin: 8px 0 10px; }
      .scoring-card p { margin-bottom: 20px; color: var(--ink-muted); }
      .scoring-card p span { margin: 0 7px; }
      html[data-theme="dark"] .game-shell { background: var(--page); }
      html[data-theme="dark"] .table-panel, html[data-theme="dark"] .players-panel, html[data-theme="dark"] .hand-panel { background: var(--surface); }
      html[data-theme="dark"] .trick-area { background: linear-gradient(145deg, #1e2b3d, #172333); border-color: #34465d; }
      html[data-theme="dark"] .message-banner { background: var(--surface-muted); }
      @media (max-width: 1050px) { .game-shell { grid-template-columns: 220px minmax(320px, 1fr); } .hand-panel { grid-column: 1 / -1; max-height: 190px; } .hand-grid { grid-template-columns: repeat(8, 64px); margin-top: 12px; } .score-panel { display: none; } }
      @media (max-width: 700px) { .home-toolbar { top: 10px; right: 10px; left: 10px; justify-content: flex-end; } .account-chip > span:not(.account-avatar) { display: none; } body { overflow: auto; } #root { min-height: 100vh; height: auto; } .game-shell { grid-template-columns: 1fr; height: auto; min-height: 100vh; padding: 56px 10px 12px; } .players-panel, .hand-panel, .table-panel { border-radius: 14px; } .players-panel { max-height: 270px; overflow: auto; } .table-panel { min-height: 460px; } .hand-panel { max-height: none; } .hand-grid { grid-template-columns: repeat(4, 64px); } .table-header h1 { font-size: 1.25rem; } }
      /* Optional retro arcade skin: chunky edges, neon accents, and subtle CRT scanlines. */
      :root { --pixel-purple: #6d4aff; --pixel-pink: #ff5ca8; --pixel-cyan: #38d9e6; --pixel-ink: #17132b; }
      body { font-family: "Courier New", monospace; image-rendering: pixelated; }
      body::before { content: ""; position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: .035; background: repeating-linear-gradient(0deg, transparent 0 3px, #000 3px 4px); }
      .home-card, .lobby-card, .players-panel, .hand-panel, .table-panel { border: 3px solid var(--pixel-ink); border-radius: 6px; box-shadow: 6px 6px 0 rgba(23,19,43,.28); }
      .home-card, .lobby-card { background: linear-gradient(135deg, rgba(33,24,64,.94), rgba(19,43,67,.94)); }
      .home-card h1, .lobby-header h1 { text-shadow: 3px 3px 0 var(--pixel-purple); }
      .brand-mark, .lobby-avatar, .player-avatar { border-radius: 4px; border: 2px solid var(--pixel-ink); box-shadow: 3px 3px 0 var(--pixel-ink); }
      .primary-action, .secondary-action, .primary-button { border: 3px solid var(--pixel-ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--pixel-ink); text-transform: uppercase; letter-spacing: .04em; }
      .primary-action:hover, .secondary-action:hover, .primary-button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--pixel-ink); }
      .modern-input { border: 3px solid var(--pixel-purple); border-radius: 4px; box-shadow: inset 3px 3px 0 rgba(0,0,0,.18); }
      .lobby-seat, .player-row { border-radius: 4px; }
      .game-shell { background-color: var(--page); background-image: linear-gradient(rgba(109,74,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(109,74,255,.06) 1px, transparent 1px); background-size: 20px 20px; }
      .players-panel, .hand-panel, .table-panel { box-shadow: 5px 5px 0 rgba(23,19,43,.25); }
      .table-header h1, .panel-heading h2 { font-family: "Courier New", monospace; text-transform: uppercase; letter-spacing: .02em; }
      .info-badge, .turn-pill, .player-count { border: 2px solid var(--pixel-purple); border-radius: 4px; }
      .trick-area { border: 3px dashed var(--pixel-purple); border-radius: 5px; }
      .hand-grid > div { border-radius: 3px !important; border-width: 3px !important; box-shadow: 4px 4px 0 rgba(23,19,43,.25) !important; }
      .leave-room-button { padding: 5px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 3px; background: rgba(255,255,255,.08); color: var(--text-dim); cursor: pointer; font-family: inherit; font-size: .68rem; font-weight: 700; }
      .leave-room-button:hover { border-color: var(--gold); color: var(--gold); }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
